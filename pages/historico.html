<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarePlus Connect — Histórico</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/historico.css" />
    <link rel="stylesheet" href="../css/variaveis.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <script src="../javascript/navbar.js" defer></script>
    <script src="../javascript/historico.js" defer></script>
</head>

<body>
    <div id="navbar-placeholder"></div>

    <main class="conteudo-principal">
        <div class="card-painel">
            <div class="cabecalho-painel">
                <h2>Meu Histórico</h2>
                <p>Acompanhe, filtre e veja os detalhes das suas consultas médicas.</p>
            </div>

            <!-- Filtros -->
            <div class="grid-filtros">
                <button class="card-filtro ativo" data-status="Todas">
                    <span class="filtro-titulo">Todas as Consultas</span>
                    <span class="filtro-numero" id="count-todas">0</span>
                </button>
                <button class="card-filtro" data-status="Agendada">
                    <span class="filtro-titulo">Consultas Agendadas</span>
                    <span class="filtro-numero" id="count-agendada">0</span>
                </button>
                <button class="card-filtro" data-status="Remarcada">
                    <span class="filtro-titulo">Consultas Remarcadas</span>
                    <span class="filtro-numero" id="count-remarcada">0</span>
                </button>
                <button class="card-filtro" data-status="Realizada">
                    <span class="filtro-titulo">Consultas Realizadas</span>
                    <span class="filtro-numero" id="count-realizada">0</span>
                </button>
                <button class="card-filtro" data-status="Cancelada">
                    <span class="filtro-titulo">Consultas Canceladas</span>
                    <span class="filtro-numero" id="count-cancelada">0</span>
                </button>
                <button class="card-filtro" data-status="Perdida">
                    <span class="filtro-titulo">Consultas Perdidas</span>
                    <span class="filtro-numero" id="count-perdida">0</span>
                </button>
            </div>

            <!-- Lista de Consultas -->
            <div class="lista-consultas" id="lista-consultas">
                <!-- O JS vai injetar os cards aqui -->
            </div>
        </div>
    </main>

    <!-- Modal -->
    <div class="modal-overlay" id="modal-consulta">
        <div class="modal-caixa-detalhes">
            <button class="btn-fechar-modal" id="btn-fechar-detalhes"><i class="bi bi-x-lg"></i></button>
            <div class="modal-topo-perfil">
                <!-- Avatar do Modal -->
                <div class="avatar-grande" id="modal-avatar">
                    <i class="bi bi-person-fill"></i>
                </div>
                <span class="pilula-status" id="modal-status">Status</span>
            </div>

            <div class="modal-info-stack">
                <div class="info-box"><strong>Médico</strong><span id="modal-medico"></span></div>
                <div class="info-box"><strong>Especialidade e CRM</strong><span id="modal-especialidade-crm"></span>
                </div>
                <div class="info-box"><strong>Data e Hora</strong><span id="modal-datahora"></span></div>
                <div class="info-box"><strong>Local</strong><span id="modal-local"></span></div>
            </div>

            <!-- Botões GPS (Waze e Maps) -->
            <div class="gps-botoes" id="container-gps" style="display: none;">
                <button class="btn-gps btn-waze" id="btn-waze"><i class="bi bi-car-front-fill"></i>Waze</button>
                <button class="btn-gps btn-maps" id="btn-maps"><i class="bi bi-geo-alt-fill"></i> Maps</button>
            </div>
        </div>
    </div>
</body>

</html>
