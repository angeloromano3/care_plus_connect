<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CarePlus Connect — Cadastro</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/variaveis.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/cadastro.css" />
    <script src="../javascript/navbar.js" defer></script>
    <script src="../javascript/cadastro.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>

    <div id="navbar-placeholder"></div>

    <main class="conteudo-principal">
        <div class="card-cadastro">
            <h2>Novo Cadastro</h2>
            <p class="subtitle">Preencha os dados abaixo para registrar um novo beneficiário.</p>

            <form id="formCadastro">
                <div class="form-grid">
                    <div class="input-group full-width">
                        <label for="nome">Nome Completo</label>
                        <input type="text" id="nome" class="required" placeholder="Ex: João da Silva">
                    </div>

                    <div class="input-group">
                        <label for="cpf">CPF</label>
                        <input type="text" id="cpf" class="required" placeholder="000.000.000-00" maxlength="14">
                    </div>

                    <div class="input-group">
                        <label for="dataNascimento">Data de Nascimento</label>
                        <input type="date" id="dataNascimento" class="required">
                    </div>

                    <div class="input-group full-width">
                        <label for="nomeMae">Nome da Mãe</label>
                        <input type="text" id="nomeMae" class="required" placeholder="Nome completo da mãe">
                    </div>

                    <div class="input-group">
                        <label for="telefone">Telefone</label>
                        <input type="text" id="telefone" class="required" placeholder="(00) 00000-0000">
                    </div>

                    <div class="input-group">
                        <label for="carteirinha">Número da Carteirinha</label>
                        <input type="text" id="carteirinha" class="required" placeholder="Ex: 123456789">
                    </div>

                    <div class="input-group full-width">
                        <label for="plano">Plano</label>
                        <select id="plano" class="required">
                            <option value="">Selecione um plano...</option>
                            <option value="basico">Care Básico</option>
                            <option value="especial">Care Especial</option>
                            <option value="premium">Care Premium</option>
                        </select>
                    </div>

                    <h3 class="full-width section-title">Endereço</h3>

                    <div class="input-group">
                        <label for="cep">CEP</label>
                        <input type="text" id="cep" class="required" placeholder="00000-000" maxlength="9">
                    </div>

                    <div class="input-group">
                        <label for="logradouro">Rua / Avenida</label>
                        <input type="text" id="logradouro" class="required" readonly>
                    </div>

                    <div class="input-group">
                        <label for="numero">Número</label>
                        <input type="text" id="numero" class="required">
                    </div>

                    <div class="input-group">
                        <label for="complemento">Complemento</label>
                        <input type="text" id="complemento" placeholder="Apto, Bloco, etc (Opcional)">
                    </div>

                    <div class="input-group">
                        <label for="bairro">Bairro</label>
                        <input type="text" id="bairro" class="required" readonly>
                    </div>

                    <div class="input-group">
                        <label for="cidade">Cidade</label>
                        <input type="text" id="cidade" class="required" readonly>
                    </div>

                    <div class="input-group">
                        <label for="estado">Estado (UF)</label>
                        <input type="text" id="estado" class="required" readonly>
                    </div>
                </div>

                <div class="actions">
                    <button type="button" class="btn-cancel" id="btnCancelar">Cancelar</button>
                    <button type="submit" class="btn-submit">Cadastrar</button>
                </div>
            </form>
        </div>
    </main>

</body>

</html>
