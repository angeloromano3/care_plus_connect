<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu perfil - segurança</title>

    <!-- CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" />
    <link rel="stylesheet" href="../css/variaveis.css" />
    <link rel="stylesheet" href="../css/navbar.css" />
    <link rel="stylesheet" href="../css/layout-perfil.css">
    <link rel="stylesheet" href="../css/seguranca.css">

    <!-- Js -->
    <script src="../javascript/navbar.js" defer></script>
    <script src="../javascript/layout-perfil.js" defer></script>
</head>
<body>

    <div id="navbar-placeholder"></div>

    <main class="perfil-layout">

    <aside class="container-lateral">
            <div class="menu-lateral"></div>
        </aside>

    <section class="container-principal">

        <header class="header-perfil">
            <h1>Segurança</h1>
            <p>Gerencie sua senha e autenticação.</p>
        </header>

        <div class="card-detalhes">
            <form class="config-form">

                <div class="mb-3">
                    <label class="form-label">Senha atual</label>
                    <input type="password" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Nova senha</label>
                    <input type="password" class="form-control">
                </div>

                <div class="mb-3">
                    <label class="form-label">Confirmar nova senha</label>
                    <input type="password" class="form-control">
                </div>

                <button class="btn-save">
                    Atualizar senha
                </button>

            </form>
        </div>

    </section>
</main>
    
</body>
</html>
